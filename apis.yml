aid: general-legal
name: General Legal
description: >-
  General Legal is an AI-native law firm for high-growth startups and SMBs,
  offering flat-fee commercial, corporate, and employment legal work delivered
  by U.S.-barred attorneys augmented with proprietary AI workflows. The firm
  focuses on contract review, redlining, negotiation, and drafting with
  transparent flat pricing (from $250) and fast turnaround (median under three
  hours), positioning itself as "outside counsel that scales like software."
  Practice areas include technology transactions, employment, data privacy,
  financial regulatory, blockchain/cryptocurrency, and emerging companies / VC.
  Founded in 2026 by Ryan Walker (ex-Casetext CTO), J.P. Mohler, and Javed
  Qadruddin, the company is a Y Combinator (W26) portfolio company that raised
  $11.5M across pre-seed and seed rounds. This profile was surfaced as a
  Y Combinator portfolio lead and enriched from public sources; General Legal
  is a legal-services company and does not currently publish a developer API.
